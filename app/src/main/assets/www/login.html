<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Planner — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --deep:#041f5c;--blue1:#0a5fdb;--blue2:#189be6;--blue3:#5fe0f2;
  --glass:rgba(255,255,255,.14);--glass-brd:rgba(255,255,255,.42);
  --white:#ffffff;--dim:rgba(255,255,255,.78);--dim2:rgba(255,255,255,.5);
}
html,body{height:100%;font-family:'Sora',sans-serif;color:var(--white)}
body{
  min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(1100px 750px at 14% 18%, rgba(255,255,255,.14), transparent 60%),
    radial-gradient(900px 700px at 88% 82%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(150deg,#052a70 0%,#0a5fdb 32%,#189be6 66%,#5fe0f2 100%);
  background-attachment:fixed;
}
.wave-field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wave{position:absolute;left:-10%;width:120%;height:420px;border-radius:50%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  filter:blur(2px);animation:waveMove var(--wd) ease-in-out infinite alternate}
@keyframes waveMove{from{transform:translateY(0) rotate(var(--wr))}to{transform:translateY(-26px) rotate(var(--wr))}}
.blob{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;
  animation:blobPulse 7s ease-in-out infinite alternate}
@keyframes blobPulse{from{opacity:.55;transform:scale(1)}to{opacity:.85;transform:scale(1.12)}}
.bubble-field{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.bubble{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 26%, rgba(255,255,255,.85), rgba(255,255,255,.18) 45%, rgba(255,255,255,.02) 72%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 10px 30px rgba(2,20,70,.22), inset 0 0 14px rgba(255,255,255,.35);
  animation:bubbleFloat var(--bd) ease-in-out infinite alternate;
}
@keyframes bubbleFloat{from{transform:translateY(0) translateX(0)}to{transform:translateY(var(--by)) translateX(var(--bx))}}
.scene{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{width:430px;max-width:100%;position:relative;overflow:hidden;
  background:linear-gradient(165deg, rgba(255,255,255,.24), rgba(255,255,255,.07));
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid var(--glass-brd);border-radius:30px;
  padding:46px 42px 40px;
  box-shadow:0 35px 90px rgba(2,16,60,.45), inset 0 1px 0 rgba(255,255,255,.55);
  animation:cardIn .8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;top:-45%;left:-25%;width:170%;height:75%;
  background:linear-gradient(120deg, rgba(255,255,255,.38), rgba(255,255,255,0) 55%);
  transform:rotate(-7deg);pointer-events:none}
.card .deco-bubble{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.8), rgba(255,255,255,.12) 50%, transparent 74%);
  border:1px solid rgba(255,255,255,.5)}
.brand-icon{width:58px;height:58px;border-radius:17px;margin:0 auto 20px;
  background:linear-gradient(135deg, rgba(255,255,255,.4), rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(2,20,70,.3), inset 0 1px 0 rgba(255,255,255,.5);position:relative;z-index:2}
.brand-icon svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1.title{position:relative;z-index:2;font-size:32px;font-weight:800;text-align:center;letter-spacing:3px;
  margin-bottom:7px;text-shadow:0 6px 24px rgba(0,20,80,.4)}
.subtitle{position:relative;z-index:2;text-align:center;font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--dim);margin-bottom:32px;font-weight:600}
.alert{position:relative;z-index:2;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);
  border-radius:14px;padding:12px 16px;font-size:13px;color:#fff;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.alert.err{background:rgba(255,80,80,.18);border-color:rgba(255,140,140,.5)}
.alert.warn{background:rgba(255,190,80,.18);border-color:rgba(255,210,140,.5)}
.alert.ok{background:rgba(140,255,190,.18);border-color:rgba(170,255,210,.5)}
.alert-dot{width:19px;height:19px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.field{position:relative;z-index:2;margin-bottom:17px}
label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px}
.iw{position:relative;display:flex;align-items:center}
.iw svg.f-ico{position:absolute;left:18px;width:18px;height:18px;stroke:rgba(255,255,255,.85);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
input{width:100%;padding:15px 46px 15px 48px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);
  border-radius:999px;color:#fff;font-size:14px;font-family:'Sora',sans-serif;outline:none;transition:.2s}
input::placeholder{color:rgba(255,255,255,.62)}
input:focus{background:rgba(255,255,255,.2);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.tp{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;
  padding:4px;color:rgba(255,255,255,.75)}
.tp svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{position:relative;z-index:2;width:100%;padding:16px;border:none;border-radius:999px;
  background:linear-gradient(135deg,#eafcff,#9fe3ff);color:#063a7a;font-weight:800;font-size:14.5px;
  letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;margin-top:10px;box-shadow:0 16px 36px rgba(2,20,70,.4);transition:.2s;font-family:'Sora',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(2,20,70,.5)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:17px;height:17px;stroke:#063a7a;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.forgot{position:relative;z-index:2;display:block;text-align:center;margin-top:18px;font-size:12.5px;
  color:var(--dim);text-decoration:none;background:none;border:none;cursor:pointer;width:100%}
.forgot:hover{color:#fff}
.foot{position:relative;z-index:2;text-align:center;font-size:13px;color:var(--dim);margin-top:10px}
.foot a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:1px}
.foot a:hover{border-color:#fff}
.demo-hint{position:relative;z-index:2;text-align:center;font-size:11px;color:var(--dim2);margin-top:16px;line-height:1.6}
@media (max-height:740px){.scene{align-items:flex-start}.card{margin-top:24px}}
.theme-toggle{position:fixed;top:22px;right:22px;z-index:50;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 10px 26px rgba(2,20,70,.28);transition:.2s}
.theme-toggle:hover{transform:translateY(-2px) scale(1.05);background:rgba(255,255,255,.24)}
.theme-toggle svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.dark-mode{
  background:
    radial-gradient(1100px 750px at 14% 18%, rgba(90,150,255,.09), transparent 60%),
    radial-gradient(900px 700px at 88% 82%, rgba(60,110,255,.08), transparent 60%),
    linear-gradient(150deg,#020510 0%,#071534 30%,#0a2050 65%,#0a2f5e 100%);
  background-attachment:fixed;
}
.dark-mode .blob{background:radial-gradient(circle,rgba(70,130,255,.18),transparent 70%) !important;opacity:.75}
.dark-mode .wave{background:linear-gradient(90deg,transparent,rgba(90,150,255,.09),transparent)}
.dark-mode .bubble{
  background:radial-gradient(circle at 30% 26%, rgba(190,220,255,.55), rgba(120,170,255,.12) 45%, rgba(255,255,255,.01) 72%);
  border-color:rgba(150,190,255,.3);
  box-shadow:0 10px 30px rgba(0,0,10,.35), inset 0 0 14px rgba(150,190,255,.2);
}
.dark-mode .card{
  background:linear-gradient(165deg, rgba(20,36,74,.55), rgba(8,16,38,.35));
  border-color:rgba(120,170,255,.35);
  box-shadow:0 35px 90px rgba(0,0,10,.6), inset 0 1px 0 rgba(150,190,255,.22);
}
.dark-mode .card::before{background:linear-gradient(120deg, rgba(150,190,255,.16), rgba(255,255,255,0) 55%)}
.dark-mode .card .deco-bubble{
  background:radial-gradient(circle at 32% 28%, rgba(190,220,255,.5), rgba(120,170,255,.08) 50%, transparent 74%);
  border-color:rgba(150,190,255,.3);
}
.dark-mode .brand-icon{
  background:linear-gradient(135deg, rgba(40,70,140,.55), rgba(8,16,38,.25));
  border-color:rgba(120,170,255,.4);
  box-shadow:0 12px 28px rgba(0,0,10,.4), inset 0 1px 0 rgba(150,190,255,.25);
}
.dark-mode label,.dark-mode .subtitle,.dark-mode .forgot,.dark-mode .foot,.dark-mode .demo-hint{color:rgba(190,215,255,.68)}
.dark-mode .iw svg.f-ico{stroke:rgba(190,215,255,.75)}
.dark-mode input{background:rgba(255,255,255,.05);border-color:rgba(120,170,255,.32);color:#eaf3ff}
.dark-mode input::placeholder{color:rgba(190,215,255,.35)}
.dark-mode input:focus{background:rgba(26,108,245,.12);border-color:#3b9eff;box-shadow:0 0 0 4px rgba(26,108,245,.18)}
.dark-mode .tp{color:rgba(190,215,255,.7)}
.dark-mode .btn{background:linear-gradient(135deg,#1a6cf5,#123a8f);color:#eaf3ff;box-shadow:0 16px 36px rgba(0,0,10,.45)}
.dark-mode .btn svg{stroke:#eaf3ff}
.dark-mode .btn:hover{box-shadow:0 20px 44px rgba(0,0,10,.55)}
.dark-mode .foot a{color:#eaf3ff;border-color:rgba(150,190,255,.5)}
.dark-mode .alert{background:rgba(20,36,74,.5);border-color:rgba(120,170,255,.35)}
.dark-mode .alert.err{background:rgba(255,80,80,.14);border-color:rgba(255,140,140,.4)}
.dark-mode .alert.warn{background:rgba(255,190,80,.14);border-color:rgba(255,210,140,.4)}
.dark-mode .alert.ok{background:rgba(140,255,190,.12);border-color:rgba(170,255,210,.4)}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
  <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<div class="blob" style="width:520px;height:520px;top:-160px;left:-160px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)"></div>
<div class="blob" style="width:460px;height:460px;bottom:-180px;right:-140px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);animation-delay:1.5s"></div>

<div class="wave-field">
  <div class="wave" style="top:16%;--wd:9s;--wr:-6deg"></div>
  <div class="wave" style="top:48%;--wd:12s;--wr:4deg;animation-delay:1s"></div>
  <div class="wave" style="top:76%;--wd:10.5s;--wr:-3deg;animation-delay:2s"></div>
</div>

<div class="bubble-field" id="bubbleField"></div>

<div class="scene">
  <div class="card">
    <div class="deco-bubble" style="width:70px;height:70px;top:-24px;right:-22px"></div>
    <div class="deco-bubble" style="width:34px;height:34px;bottom:70px;right:-14px"></div>
    <div class="deco-bubble" style="width:22px;height:22px;bottom:22px;left:-10px"></div>

    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>

    <h1 class="title">LOGIN</h1>
    <div class="subtitle">Access your Student Planner</div>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <div class="iw">
          <svg class="f-ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="iw">
          <svg class="f-ico" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="tp" onclick="tpw()">
            <svg id="eye" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn" type="submit">
        Login
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <button type="button" class="forgot" onclick="alert('Please contact an admin to reset your password.')">Forgot Password?</button>
    <div class="foot">Don't have an account? <a href="register.html">Sign Up</a></div>
    <div class="demo-hint">Demo logins — admin / admin123 &nbsp;·&nbsp; juan / juan123</div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
// if already logged in, skip straight to dashboard
if (SP.currentUser()) location.href = 'index.html';

const params = new URLSearchParams(location.search);
const alertBox = document.getElementById('alertBox');
function showAlert(msg, kind){
  alertBox.innerHTML = `<div class="alert ${kind}"><div class="alert-dot">${kind==='ok'?'✓':'!'}</div><span>${msg}</span></div>`;
}
if (params.get('kicked')) showAlert('Your session has ended or your account was suspended. Please sign in again.', 'warn');
if (params.get('registered') && params.get('pending')) showAlert('Account created! Your admin request is awaiting approval from an existing admin.', 'warn');
else if (params.get('registered')) showAlert('Account created! Please sign in to continue.', 'ok');

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!username || !password) { showAlert('Please enter both username and password.', 'err'); return; }
  const res = SP.login(username, password);
  if (res.ok) location.href = 'index.html';
  else showAlert(res.msg, 'err');
});

function tpw(){
  const i=document.getElementById('password'),hide=i.type==='password';
  i.type=hide?'text':'password';
  document.getElementById('eye').innerHTML=hide
    ?'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    :'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

const field = document.getElementById('bubbleField');
const sizes = [10,14,18,22,28,36,46,60,80,110];
for (let i = 0; i < 34; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const sz = sizes[Math.floor(Math.random()*sizes.length)];
  const top = Math.random()*100;
  const left = Math.random()*100;
  const dur = (Math.random()*6+5).toFixed(1);
  const bx = (Math.random()*30-15).toFixed(0);
  const by = -(Math.random()*40+16).toFixed(0);
  const op = (Math.random()*.35+.35).toFixed(2);
  b.style.cssText = `width:${sz}px;height:${sz}px;top:${top}%;left:${left}%;opacity:${op};--bd:${dur}s;--bx:${bx}px;--by:${by}px;animation-delay:${(Math.random()*4).toFixed(1)}s`;
  field.appendChild(b);
}

const SUN_ICON  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const themeIcon = document.getElementById('themeIcon');
const themeToggle = document.getElementById('themeToggle');
function applyTheme(mode){
  document.body.classList.toggle('dark-mode', mode === 'dark');
  themeIcon.innerHTML = mode === 'dark' ? MOON_ICON : SUN_ICON;
  themeToggle.title = mode === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
}
applyTheme(localStorage.getItem('sp_theme_mode') || 'light');
themeToggle.addEventListener('click', function(){
  const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
  localStorage.setItem('sp_theme_mode', next);
  applyTheme(next);
});
</script>
</body>
</html>
