<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Schedule — Student Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/app.js"></script>
<script>
SP.initPage({ activeNav:'schedule', title:'Class Schedule', sub:'The weekly timetable for the whole school.' }, (root, ctx) => {
  const { db, save, canManage } = ctx;
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const subjName = id => { const s = db.subjects.find(s=>s.id===id); return s ? s.subject_name : '(unknown)'; };
  const subjColor = id => { const s = db.subjects.find(s=>s.id===id); return s ? s.color : '#1a6cf5'; };

  function openForm(entry) {
    const editing = !!entry;
    if (db.subjects.length === 0) { SP.toast('Add a subject first.', 'err'); return; }
    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg show" id="schModal">
      <div class="modal">
        <div class="modal-head"><div class="modal-title">${editing?'Edit Class':'Add Class'}</div>
          <button class="modal-close" onclick="document.getElementById('schModal').remove()">✕</button></div>
        <form id="schForm">
          <div class="form-row"><div><label>Subject</label><select id="fSubject">
            ${db.subjects.map(s=>`<option value="${s.id}" ${editing&&entry.subject_id===s.id?'selected':''}>${SP.h(s.subject_name)}</option>`).join('')}
          </select></div></div>
          <div class="form-row cols-2">
            <div><label>Day</label><select id="fDay">${DAYS.map(d=>`<option value="${d}" ${editing&&entry.day_of_week===d?'selected':''}>${d}</option>`).join('')}</select></div>
            <div><label>Room</label><input type="text" id="fRoom" value="${editing?SP.h(entry.room||''):''}"></div>
          </div>
          <div class="form-row cols-2">
            <div><label>Start Time</label><input type="time" id="fStart" value="${editing?entry.start_time:'08:00'}"></div>
            <div><label>End Time</label><input type="time" id="fEnd" value="${editing?entry.end_time:'09:00'}"></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('schModal').remove()">Cancel</button>
            <button type="submit" class="btn btn-primary">${editing?'Save Changes':'Add Class'}</button>
          </div>
        </form>
      </div>
    </div>`);
    document.getElementById('schForm').addEventListener('submit', e => {
      e.preventDefault();
      const vals = {
        subject_id: parseInt(document.getElementById('fSubject').value,10),
        day_of_week: document.getElementById('fDay').value,
        room: document.getElementById('fRoom').value.trim(),
        start_time: document.getElementById('fStart').value,
        end_time: document.getElementById('fEnd').value
      };
      if (editing) Object.assign(entry, vals);
      else db.schedule.push({ id: ctx.nextId(db,'schedule'), ...vals });
      save(db); document.getElementById('schModal').remove(); SP.toast(editing?'Class updated.':'Class added.'); render();
    });
  }

  function render() {
    root.innerHTML = `
      <div class="section-head">
        <div><div class="section-eyebrow">Weekly Timetable</div><div class="section-title">Class Schedule</div></div>
        ${canManage ? `<button class="btn btn-primary" id="addBtn">+ Add Class</button>` : ''}
      </div>
      <div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));display:grid;gap:16px">
        ${DAYS.map(day => {
          const items = db.schedule.filter(s=>s.day_of_week===day).sort((a,b)=>a.start_time.localeCompare(b.start_time));
          return `
          <div class="card card-pad">
            <div style="font-weight:700;font-size:14px;margin-bottom:12px">${day}</div>
            ${items.length===0 ? `<div style="font-size:12px;color:var(--muted2)">No classes</div>` :
              items.map(c => `
              <div style="padding:10px 0;border-bottom:1px solid rgba(90,120,190,.08)">
                <div class="flex items-center gap-10">
                  <span class="chip" style="background:${subjColor(c.subject_id)}"></span>
                  <div style="flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${SP.h(subjName(c.subject_id))}</div>
                </div>
                <div style="font-size:11px;color:var(--glow2);font-weight:600;margin-top:4px">${SP.fmtTime(c.start_time)} – ${SP.fmtTime(c.end_time)}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">${SP.h(c.room||'No room set')}</div>
                ${canManage ? `<div class="flex gap-8" style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-edit="${c.id}">Edit</button><button class="btn btn-danger btn-sm" data-del="${c.id}">Delete</button></div>` : ''}
              </div>`).join('')}
          </div>`;
        }).join('')}
      </div>`;

    if (canManage) {
      document.getElementById('addBtn').addEventListener('click', () => openForm(null));
      root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(db.schedule.find(s=>s.id===parseInt(b.dataset.edit,10)))));
      root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        if (!confirm('Remove this class from the schedule?')) return;
        db.schedule = db.schedule.filter(s=>s.id!==parseInt(b.dataset.del,10));
        save(db); SP.toast('Class removed.'); render();
      }));
    }
  }
  render();
});
</script>
</body>
</html>
