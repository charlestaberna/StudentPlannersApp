<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects — Student Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/app.js"></script>
<script>
SP.initPage({ activeNav:'subjects', title:'Subjects', sub:'Classes and courses on the schoolwide roster.' }, (root, ctx) => {
  const { db, save, canManage } = ctx;

  function openForm(subj) {
    const editing = !!subj;
    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg show" id="subModal">
      <div class="modal">
        <div class="modal-head"><div class="modal-title">${editing?'Edit Subject':'Add Subject'}</div>
          <button class="modal-close" onclick="document.getElementById('subModal').remove()">✕</button></div>
        <form id="subForm">
          <div class="form-row"><div><label>Subject Name</label><input type="text" id="fName" value="${editing?SP.h(subj.subject_name):''}" required></div></div>
          <div class="form-row cols-2">
            <div><label>Subject Code</label><input type="text" id="fCode" value="${editing?SP.h(subj.subject_code||''):''}"></div>
            <div><label>Units</label><input type="number" step="0.5" id="fUnits" value="${editing?(subj.units??''):''}"></div>
          </div>
          <div class="form-row cols-2">
            <div><label>Instructor</label><input type="text" id="fInstructor" value="${editing?SP.h(subj.instructor||''):''}"></div>
            <div><label>Color</label><input type="color" id="fColor" value="${editing?subj.color:'#1a6cf5'}"></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('subModal').remove()">Cancel</button>
            <button type="submit" class="btn btn-primary">${editing?'Save Changes':'Add Subject'}</button>
          </div>
        </form>
      </div>
    </div>`);
    document.getElementById('subForm').addEventListener('submit', e => {
      e.preventDefault();
      const vals = {
        subject_name: document.getElementById('fName').value.trim(),
        subject_code: document.getElementById('fCode').value.trim(),
        units: parseFloat(document.getElementById('fUnits').value) || null,
        instructor: document.getElementById('fInstructor').value.trim(),
        color: document.getElementById('fColor').value
      };
      if (!vals.subject_name) return;
      if (editing) Object.assign(subj, vals);
      else db.subjects.push({ id: ctx.nextId(db,'subjects'), user_id: ctx.user.id, ...vals });
      save(db); document.getElementById('subModal').remove(); SP.toast(editing?'Subject updated.':'Subject added.'); render();
    });
  }

  function render() {
    const list = db.subjects;
    root.innerHTML = `
      <div class="section-head">
        <div><div class="section-eyebrow">Roster</div><div class="section-title">${list.length} Subject${list.length===1?'':'s'}</div></div>
        ${canManage ? `<button class="btn btn-primary" id="addBtn">+ Add Subject</button>` : ''}
      </div>
      ${list.length===0 ? `<div class="card"><div class="empty-state"><div class="empty-title">No subjects yet</div><div class="empty-sub">${canManage?'Add your first subject to get started.':'Check back once your admin/faculty sets these up.'}</div></div></div>` : `
      <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        ${list.map(s => {
          const taskCount = db.tasks.filter(t=>t.subject_id===s.id).length;
          return `
          <div class="card card-pad" style="--c:${s.color}">
            <div class="flex items-center gap-10" style="margin-bottom:10px">
              <span class="chip" style="width:14px;height:14px;background:${s.color}"></span>
              <div style="font-weight:700;font-size:15px;flex:1">${SP.h(s.subject_name)}</div>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${s.subject_code?SP.h(s.subject_code)+' · ':''}${s.units?s.units+' units':''}</div>
            <div style="font-size:12.5px;color:var(--muted2);margin-bottom:14px">${s.instructor?SP.h(s.instructor):'No instructor set'}</div>
            <div class="flex items-center" style="justify-content:space-between">
              <span class="pill">${taskCount} task${taskCount===1?'':'s'}</span>
              ${canManage ? `<div class="flex gap-8"><button class="btn btn-ghost btn-sm" data-edit="${s.id}">Edit</button><button class="btn btn-danger btn-sm" data-del="${s.id}">Delete</button></div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`}`;

    if (canManage) {
      document.getElementById('addBtn').addEventListener('click', () => openForm(null));
      root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(db.subjects.find(s=>s.id===parseInt(b.dataset.edit,10)))));
      root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        if (!confirm('Delete this subject? Tasks and schedule entries linked to it will lose that link.')) return;
        const id = parseInt(b.dataset.del,10);
        db.subjects = db.subjects.filter(s=>s.id!==id);
        db.tasks.forEach(t => { if (t.subject_id===id) t.subject_id = null; });
        db.notes.forEach(n => { if (n.subject_id===id) n.subject_id = null; });
        db.schedule = db.schedule.filter(sc => sc.subject_id !== id);
        save(db); SP.toast('Subject deleted.'); render();
      }));
    }
  }
  render();
});
</script>
</body>
</html>
