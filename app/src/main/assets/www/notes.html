<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — Student Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/app.js"></script>
<script>
SP.initPage({ activeNav:'notes', title:'Notes', sub:'Quick notes, optionally linked to a subject.' }, (root, ctx) => {
  const { db, save, canManage } = ctx;
  const subjName = id => { const s = db.subjects.find(s=>s.id===id); return s ? s.subject_name : ''; };

  function openForm(note) {
    const editing = !!note;
    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg show" id="noteModal">
      <div class="modal">
        <div class="modal-head"><div class="modal-title">${editing?'Edit Note':'Add Note'}</div>
          <button class="modal-close" onclick="document.getElementById('noteModal').remove()">✕</button></div>
        <form id="noteForm">
          <div class="form-row"><div><label>Title</label><input type="text" id="fTitle" value="${editing?SP.h(note.title):''}" required></div></div>
          <div class="form-row"><div><label>Content</label><textarea id="fContent" style="min-height:120px">${editing?SP.h(note.content||''):''}</textarea></div></div>
          <div class="form-row"><div><label>Subject (optional)</label><select id="fSubject">
            <option value="">None</option>
            ${db.subjects.map(s=>`<option value="${s.id}" ${editing&&note.subject_id===s.id?'selected':''}>${SP.h(s.subject_name)}</option>`).join('')}
          </select></div></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('noteModal').remove()">Cancel</button>
            <button type="submit" class="btn btn-primary">${editing?'Save Changes':'Add Note'}</button>
          </div>
        </form>
      </div>
    </div>`);
    document.getElementById('noteForm').addEventListener('submit', e => {
      e.preventDefault();
      const vals = {
        title: document.getElementById('fTitle').value.trim(),
        content: document.getElementById('fContent').value.trim(),
        subject_id: document.getElementById('fSubject').value ? parseInt(document.getElementById('fSubject').value,10) : null,
        updated_at: new Date().toISOString()
      };
      if (!vals.title) return;
      if (editing) Object.assign(note, vals);
      else db.notes.push({ id: ctx.nextId(db,'notes'), user_id: ctx.user.id, is_pinned:0, ...vals });
      save(db); document.getElementById('noteModal').remove(); SP.toast(editing?'Note updated.':'Note added.'); render();
    });
  }

  function render() {
    const list = db.notes.slice().sort((a,b) => (b.is_pinned - a.is_pinned) || (b.updated_at||'').localeCompare(a.updated_at||''));
    root.innerHTML = `
      <div class="section-head">
        <div><div class="section-eyebrow">Notebook</div><div class="section-title">${list.length} Note${list.length===1?'':'s'}</div></div>
        ${canManage ? `<button class="btn btn-primary" id="addBtn">+ Add Note</button>` : ''}
      </div>
      ${list.length===0 ? `<div class="card"><div class="empty-state"><div class="empty-title">No notes yet</div><div class="empty-sub">${canManage?'Jot down something worth remembering.':'Nothing has been shared here yet.'}</div></div></div>` : `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
        ${list.map(n => `
          <div class="card card-pad">
            <div class="flex items-center gap-10" style="margin-bottom:8px">
              ${n.is_pinned ? '<span class="pill gold">📌 Pinned</span>' : ''}
              ${n.subject_id ? `<span class="pill">${SP.h(subjName(n.subject_id))}</span>` : ''}
            </div>
            <div style="font-weight:700;font-size:15px;margin-bottom:6px">${SP.h(n.title)}</div>
            <div style="font-size:13px;color:var(--muted);white-space:pre-wrap;margin-bottom:14px">${SP.h(n.content||'')}</div>
            ${canManage ? `
            <div class="flex gap-8">
              <button class="btn btn-outline btn-sm" data-pin="${n.id}">${n.is_pinned?'Unpin':'Pin'}</button>
              <button class="btn btn-ghost btn-sm" data-edit="${n.id}">Edit</button>
              <button class="btn btn-danger btn-sm" data-del="${n.id}">Delete</button>
            </div>` : ''}
          </div>`).join('')}
      </div>`}`;

    if (canManage) {
      document.getElementById('addBtn').addEventListener('click', () => openForm(null));
      root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(db.notes.find(n=>n.id===parseInt(b.dataset.edit,10)))));
      root.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', () => {
        const n = db.notes.find(n=>n.id===parseInt(b.dataset.pin,10));
        n.is_pinned = n.is_pinned ? 0 : 1; save(db); render();
      }));
      root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        if (!confirm('Delete this note?')) return;
        db.notes = db.notes.filter(n=>n.id!==parseInt(b.dataset.del,10));
        save(db); SP.toast('Note deleted.'); render();
      }));
    }
  }
  render();
});
</script>
</body>
</html>
