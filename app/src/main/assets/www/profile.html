<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Student Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.profile-av-wrap{width:110px;height:110px;border-radius:50%;overflow:hidden}
.profile-av{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--glow),var(--gold));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:36px;color:#04102b}
.profile-av-wrap.clickable{cursor:pointer}
</style>
</head>
<body>
<script src="assets/js/app.js"></script>
<script>
SP.initPage({ activeNav:'profile', title:'My Profile', sub:'This picture follows your account everywhere — sidebar, chat, and more.' }, (root, ctx) => {
  const { db, save, user } = ctx;
  let pendingAvatar = null;

  function render() {
    root.innerHTML = `
      <div class="grid-2">
        <div class="card card-pad" style="text-align:center">
          <div class="section-eyebrow" style="justify-content:center">Profile Picture</div>
          <div style="display:flex;justify-content:center;margin:14px 0 16px">
            <div class="profile-av-wrap">${user.avatar ? `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover">` : `<div class="profile-av">${SP.h(SP.initials(user.name))}</div>`}</div>
          </div>
          <label class="btn btn-outline btn-sm" style="cursor:pointer;display:inline-flex">
            Choose Image
            <input type="file" id="avatarInput" accept="image/*" style="display:none">
          </label>
          <div id="avatarFileName" style="font-size:12px;color:var(--muted);margin-top:10px"></div>
          <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
            <button id="avatarSaveBtn" class="btn btn-primary btn-sm" style="display:none">Save Picture</button>
          </div>
          ${user.avatar ? `<div style="margin-top:10px"><button id="avatarRemoveBtn" class="btn btn-danger btn-sm">Remove Picture</button></div>` : ''}
          <div style="font-size:11.5px;color:var(--muted2);margin-top:16px">JPG, PNG, GIF or WEBP</div>
        </div>

        <div class="card card-pad">
          <div class="section-eyebrow">Account</div>
          <div class="section-title" style="margin-bottom:16px">Your Details</div>
          <form id="detailsForm">
            <div class="form-row"><div><label>Full Name</label><input type="text" id="fName" value="${SP.h(user.name)}"></div></div>
            <div class="form-row"><div><label>Username</label><input type="text" value="${SP.h(user.username)}" disabled style="opacity:.6"></div></div>
            <div class="form-row"><div><label>Role</label><input type="text" value="${SP.h(user.role)}" disabled style="opacity:.6;text-transform:capitalize"></div></div>
            <div class="modal-actions" style="justify-content:flex-start;margin-top:8px">
              <button type="submit" class="btn btn-primary btn-sm">Save Details</button>
            </div>
          </form>

          <div class="section-eyebrow" style="margin-top:24px">Password</div>
          <form id="pwForm" style="margin-top:12px">
            <div class="form-row"><div><label>New Password</label><input type="password" id="fPassword" placeholder="Leave blank to keep current password"></div></div>
            <div class="modal-actions" style="justify-content:flex-start;margin-top:8px">
              <button type="submit" class="btn btn-outline btn-sm">Update Password</button>
            </div>
          </form>
        </div>
      </div>`;

    document.getElementById('avatarInput').addEventListener('change', function(){
      const f = this.files[0];
      if (!f) return;
      if (f.size > 3*1024*1024) { SP.toast('Image is too big. Max size is 3MB.', 'err'); this.value=''; return; }
      const reader = new FileReader();
      reader.onload = () => { pendingAvatar = reader.result; document.getElementById('avatarFileName').textContent = f.name; document.getElementById('avatarSaveBtn').style.display = 'inline-flex'; };
      reader.readAsDataURL(f);
    });
    document.getElementById('avatarSaveBtn').addEventListener('click', () => {
      if (!pendingAvatar) return;
      user.avatar = pendingAvatar; save(db); SP.toast('Profile picture updated.'); render();
    });
    const removeBtn = document.getElementById('avatarRemoveBtn');
    if (removeBtn) removeBtn.addEventListener('click', () => {
      if (!confirm('Remove your profile picture?')) return;
      user.avatar = null; save(db); SP.toast('Profile picture removed.'); render();
    });
    document.getElementById('detailsForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('fName').value.trim();
      if (!name) return;
      user.name = name; save(db); SP.toast('Details updated.'); render();
    });
    document.getElementById('pwForm').addEventListener('submit', e => {
      e.preventDefault();
      const pw = document.getElementById('fPassword').value.trim();
      if (!pw) { SP.toast('Enter a new password first.', 'err'); return; }
      user.password = pw; save(db); SP.toast('Password updated.'); document.getElementById('fPassword').value='';
    });
  }
  render();
});
</script>
</body>
</html>
