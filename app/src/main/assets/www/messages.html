<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Messages — Student Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/app.js"></script>
<script>
SP.initPage({ activeNav:'chat', title:'Group Messages', sub:'One shared chat for everyone, plus any private groups you create.' }, (root, ctx) => {
  const { db, save, user: me } = ctx;
  let activeGroup = null; // null = the shared "General" chat
  let pendingImage = null;
  let pendingGroupLogo = null;

  // ---------------------------------------------------------------
  // Live sync: two people chatting "with each other" only actually
  // works if the messages one person sends are pulled back in for the
  // other person to see — using the SAME saved data, not a copy of it.
  // `db` here can go stale the moment another browser tab (another
  // logged-in account) saves a new message, so every read below goes
  // through refreshFromDisk() first, and every write reloads the latest
  // data right before saving, so two people sending at almost the same
  // time don't overwrite each other.
  //
  // FIX: this used to only do `Object.assign(db, SP.load())`, which
  // replaces db.users with a brand new array of brand new objects.
  // The `me` reference we hold onto was NOT one of those new objects,
  // so anything mutated directly on `me` (like uploading a chat
  // background photo) got written onto an orphaned object that was no
  // longer part of db.users — save(db) would then persist the OLD
  // data and the edit silently vanished on the next refresh/reload.
  // Now we merge the fresh disk data into the SAME `me` object and put
  // that same object back into db.users, so `me` is never stale and
  // anything we change on it is guaranteed to be included on save.
  // ---------------------------------------------------------------
  function refreshFromDisk() {
    Object.assign(db, SP.load());
    const idx = db.users.findIndex(u => u.id === me.id);
    if (idx !== -1) {
      Object.assign(me, db.users[idx]); // pull in any newer fields from disk
      db.users[idx] = me;               // keep it the SAME object going forward
    }
  }

  function userById(id){ return db.users.find(u=>u.id===id); }
  function groupMembers(g){ return g.member_ids || []; }
  function myGroups(){ return db.groups.filter(g => groupMembers(g).includes(me.id)); }

  // Avatar + green/red online-offline dot, reusing the app's own
  // .msg-avatar-wrap / .status-dot styling.
  function avatarWithStatus(u, sizeCls) {
    return `<div class="msg-avatar-wrap">
      ${SP.avatarHtml(u, sizeCls)}
      <span class="status-dot ${SP.isOnline(u)?'online':'offline'}" title="${SP.isOnline(u)?'Online':'Offline'}"></span>
    </div>`;
  }

  function openNewGroupModal() {
    refreshFromDisk();
    pendingGroupLogo = null;
    const others = db.users.filter(u => u.id !== me.id);
    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg show" id="grpModal">
      <div class="modal">
        <div class="modal-head"><div class="modal-title">New Group</div><button class="modal-close" onclick="document.getElementById('grpModal').remove()">✕</button></div>
        <form id="grpForm">
          <div class="form-row"><div style="text-align:center">
            <div id="grpLogoPreview" style="width:64px;height:64px;border-radius:50%;margin:0 auto 10px;overflow:hidden;background:linear-gradient(135deg,var(--glow),var(--gold));display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)">No Photo</div>
            <label class="btn btn-outline btn-sm" style="cursor:pointer;display:inline-flex">Choose Group Photo<input type="file" id="fGPhoto" accept="image/*" style="display:none"></label>
          </div></div>
          <div class="form-row"><div><label>Group Name</label><input type="text" id="fGName" required></div></div>
          <div class="form-row"><div><label>Members</label>
            <div class="member-pick-list">
              ${others.length===0 ? '<div style="padding:10px;color:var(--muted2);font-size:12px">No other accounts yet.</div>' : others.map(u => `
                <label class="member-pick-row">
                  <input type="checkbox" value="${u.id}">
                  ${avatarWithStatus(u,'msg-avatar')}
                  ${SP.h(u.name)} <span class="member-pick-role">(${u.role})</span>
                </label>
              `).join('')}
            </div>
          </div></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('grpModal').remove()">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Group</button>
          </div>
        </form>
      </div>
    </div>`);
    document.getElementById('fGPhoto').addEventListener('change', function(){
      const f = this.files[0]; if (!f) return;
      if (f.size > 3*1024*1024) { SP.toast('Image is too big. Max size is 3MB.', 'err'); this.value=''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        pendingGroupLogo = reader.result;
        document.getElementById('grpLogoPreview').innerHTML = `<img src="${pendingGroupLogo}" style="width:100%;height:100%;object-fit:cover">`;
      };
      reader.readAsDataURL(f);
    });
    document.getElementById('grpForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('fGName').value.trim();
      if (!name) return;
      const checked = Array.from(document.querySelectorAll('#grpModal input[type=checkbox]:checked')).map(c=>parseInt(c.value,10));
      refreshFromDisk(); // reload right before writing so we don't clobber a group someone else just created
      const id = ctx.nextId(db,'groups');
      db.groups.push({ id, name, logo: pendingGroupLogo, created_by: me.id, member_ids: [me.id, ...checked] });
      save(db); document.getElementById('grpModal').remove(); activeGroup = id; SP.toast('Group created.'); render();
    });
  }

  function visibleMessages() {
    return db.messages.filter(m => (m.group_id||null) === activeGroup && !(m.hidden_for||[]).includes(me.id));
  }

  function applyChatBg() {
    const box = document.getElementById('chatMessages');
    if (!box) return;
    if (me.chat_bg) {
      box.classList.add('has-bg');
      box.style.backgroundImage = `url("${me.chat_bg}")`;
    } else {
      box.classList.remove('has-bg');
      box.style.backgroundImage = '';
    }
  }

  function render() {
    refreshFromDisk();
    const groups = myGroups();
    root.innerHTML = `
      <div class="card chat-wrap">
        <div class="chat-tabs" style="padding:14px 22px 0">
          <div class="chat-tab ${activeGroup===null?'active':''}" data-tab="general">
            <div class="chat-tab-av chat-tab-av-general">🏫</div> General
          </div>
          ${groups.map(g => `
            <div class="chat-tab ${activeGroup===g.id?'active':''}" data-tab="${g.id}">
              <div class="chat-tab-av">${g.logo?`<img src="${g.logo}" class="chat-tab-av-img" style="width:100%;height:100%;object-fit:cover">`:SP.h(SP.initials(g.name))}</div>
              ${SP.h(g.name)} ${g.created_by===me.id?'<span class="chat-tab-owner">★</span>':''}
            </div>`).join('')}
          <div class="chat-tab chat-tab-new" id="newGroupTab">+ New Group</div>
        </div>
        <div class="chat-head">
          <div class="flex items-center gap-10">
            <div class="chat-head-av">${activeGroup===null?'🏫':(db.groups.find(g=>g.id===activeGroup)||{}).logo?`<img src="${(db.groups.find(g=>g.id===activeGroup)||{}).logo}" class="chat-head-av avatar-img">`:SP.h(SP.initials((db.groups.find(g=>g.id===activeGroup)||{name:'?'}).name))}</div>
            <div>
              <div style="font-weight:700;font-size:14px">${activeGroup===null?'General (everyone)':SP.h((db.groups.find(g=>g.id===activeGroup)||{name:'?'}).name)}</div>
              <div style="font-size:11px;color:var(--muted)">${activeGroup===null?db.users.length+' members':groupMembers(db.groups.find(g=>g.id===activeGroup)||{}).length+' members'}</div>
            </div>
          </div>
          <div class="chat-head-actions">
            <button class="chat-bg-btn" id="bgBtn" title="Change chat background">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <div class="chat-bg-menu" id="bgMenu">
              <div class="chat-bg-menu-title">Chat Background</div>
              <div class="chat-bg-menu-sub">Personalize how chats look for you with a background image. Only you see it.</div>
              <label class="btn btn-outline btn-sm chat-bg-upload-label">Upload Image<input type="file" id="bgInput" accept="image/*" style="display:none"></label>
              ${me.chat_bg ? `<button type="button" class="btn btn-danger btn-sm chat-bg-remove-btn" id="bgRemoveBtn">Remove Background</button>` : ''}
            </div>
            ${activeGroup!==null && (db.groups.find(g=>g.id===activeGroup)||{}).created_by===me.id ? `<button class="btn btn-danger btn-sm" id="delGroupBtn">Delete Group</button>` : ''}
          </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-attach-preview" id="attachPreview"><span class="name"></span><button id="attachClear">✕</button></div>
        <div class="chat-input-row">
          <button class="chat-attach-btn" id="attachBtn" title="Attach image">
            <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="imgInput" accept="image/*" style="display:none">
          <input type="text" id="msgInput" placeholder="Type a message…">
          <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
      </div>`;

    applyChatBg();
    renderMessages();

    root.querySelectorAll('[data-tab]').forEach(tab => tab.addEventListener('click', () => {
      // If a group I was in got deleted by its owner while I was looking at
      // it, fall back to General instead of showing a broken/empty group.
      const target = tab.dataset.tab === 'general' ? null : parseInt(tab.dataset.tab,10);
      activeGroup = target !== null && !db.groups.some(g=>g.id===target) ? null : target;
      render();
    }));
    document.getElementById('newGroupTab').addEventListener('click', openNewGroupModal);
    const delBtn = document.getElementById('delGroupBtn');
    if (delBtn) delBtn.addEventListener('click', () => {
      if (!confirm('Delete this group for everyone?')) return;
      const id = activeGroup;
      refreshFromDisk();
      db.groups = db.groups.filter(g=>g.id!==id);
      db.messages = db.messages.filter(m=>m.group_id!==id);
      activeGroup = null; save(db); render();
    });

    const bgBtn = document.getElementById('bgBtn');
    const bgMenu = document.getElementById('bgMenu');
    bgBtn.addEventListener('click', (e) => { e.stopPropagation(); bgMenu.classList.toggle('show'); });
    document.addEventListener('click', function closeBgMenu(e){
      if (!bgMenu.contains(e.target) && e.target !== bgBtn) bgMenu.classList.remove('show');
    });
    document.getElementById('bgInput').addEventListener('change', function(){
      const f = this.files[0]; if (!f) return;
      if (f.size > 4*1024*1024) { SP.toast('Image is too big. Max size is 4MB.', 'err'); this.value=''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        refreshFromDisk();
        me.chat_bg = reader.result;
        save(db);
        SP.toast('Chat background updated.');
        render();
      };
      reader.readAsDataURL(f);
    });
    const bgRemoveBtn = document.getElementById('bgRemoveBtn');
    if (bgRemoveBtn) bgRemoveBtn.addEventListener('click', () => {
      refreshFromDisk();
      me.chat_bg = null;
      save(db);
      SP.toast('Chat background removed.');
      render();
    });

    document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('imgInput').click());
    document.getElementById('imgInput').addEventListener('change', function(){
      const f = this.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        pendingImage = reader.result;
        const prev = document.getElementById('attachPreview');
        prev.classList.add('show'); prev.querySelector('.name').textContent = f.name;
      };
      reader.readAsDataURL(f);
    });
    document.getElementById('attachClear').addEventListener('click', () => { pendingImage = null; document.getElementById('attachPreview').classList.remove('show'); document.getElementById('imgInput').value=''; });

    function send() {
      const input = document.getElementById('msgInput');
      const body = input.value.trim();
      if (!body && !pendingImage) return;
      refreshFromDisk(); // pull in anything the other person just sent before we add ours
      const id = ctx.nextId(db,'messages');
      db.messages.push({
        id, user_id: me.id, group_id: activeGroup,
        body, image: pendingImage, created_at: new Date().toISOString(), hidden_for: []
      });
      pendingImage = null;
      document.getElementById('attachPreview').classList.remove('show');
      input.value = '';
      save(db); renderMessages();
    }
    document.getElementById('sendBtn').addEventListener('click', send);
    document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  }

  function renderMessages() {
    refreshFromDisk();
    const box = document.getElementById('chatMessages');
    const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    const msgs = visibleMessages().sort((a,b) => a.created_at.localeCompare(b.created_at));
    box.innerHTML = msgs.length === 0 ? `<div class="empty-state"><div class="empty-title">No messages yet</div><div class="empty-sub">Say hello 👋</div></div>` :
      msgs.map(m => {
        const u = userById(m.user_id) || { name:'Unknown', role:'student' };
        const mine = m.user_id === me.id;
        const time = new Date(m.created_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        return `
        <div class="msg-row ${mine?'me':'them'}">
          ${avatarWithStatus(u,'msg-avatar')}
          <div class="msg-col">
            ${!mine ? `<div class="msg-name">${SP.h(u.name)} <span class="badge role-${u.role} msg-badge">${u.role}</span></div>` : ''}
            <div class="msg-bubble">
              ${m.body ? SP.h(m.body) : ''}
              ${m.image ? `<img src="${m.image}" class="msg-image">` : ''}
            </div>
            <div class="msg-time">
              ${time}
              ${mine ? `<button class="msg-del" data-unsend="${m.id}">Unsend</button>` : `<button class="msg-hide" data-hide="${m.id}">Hide</button>`}
            </div>
          </div>
        </div>`;
      }).join('');
    if (wasNearBottom) box.scrollTop = box.scrollHeight;

    box.querySelectorAll('[data-unsend]').forEach(b => b.addEventListener('click', () => {
      refreshFromDisk();
      db.messages = db.messages.filter(m=>m.id!==parseInt(b.dataset.unsend,10));
      save(db); renderMessages();
    }));
    box.querySelectorAll('[data-hide]').forEach(b => b.addEventListener('click', () => {
      refreshFromDisk();
      const m = db.messages.find(m=>m.id===parseInt(b.dataset.hide,10));
      if (!m) return;
      m.hidden_for = m.hidden_for || []; m.hidden_for.push(me.id);
      save(db); renderMessages();
    }));
  }

  render();

  // Live updates: if the other person is chatting from another tab/window
  // on this same device (e.g. admin in one tab, student in another), pull
  // their messages in automatically — no manual refresh needed.
  SP.onDbChange(() => renderMessages());
  const livePoll = setInterval(() => renderMessages(), 3000);
  window.addEventListener('beforeunload', () => clearInterval(livePoll));
});
</script>
</body>
</html>
