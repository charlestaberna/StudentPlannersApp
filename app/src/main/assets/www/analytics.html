<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Student Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar-label{width:150px;font-size:12px;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-val{width:34px;text-align:right;font-size:12px;color:var(--muted);flex-shrink:0}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
</style>
</head>
<body>
<script src="assets/js/app.js"></script>
<script>
SP.initPage({ activeNav:'analytics', title:'Analytics', sub:'A school-wide look at tasks, subjects and progress.' }, (root, ctx) => {
  const { db } = ctx;
  const tasks = db.tasks;
  const total = tasks.length;
  const byStatus = { pending:0, in_progress:0, completed:0 };
  tasks.forEach(t => byStatus[t.status] = (byStatus[t.status]||0) + 1);
  const byPriority = { high:0, medium:0, low:0 };
  tasks.forEach(t => byPriority[t.priority] = (byPriority[t.priority]||0) + 1);
  const completionRate = total ? Math.round((byStatus.completed/total)*100) : 0;
  const overdue = tasks.filter(t=>t.status!=='completed' && t.due_date && t.due_date < SP.todayStr()).length;

  const bySubject = db.subjects.map(s => ({
    name: s.subject_name, color: s.color,
    count: tasks.filter(t=>t.subject_id===s.id).length,
    completed: tasks.filter(t=>t.subject_id===s.id && t.status==='completed').length
  }));
  const maxSubjectCount = Math.max(1, ...bySubject.map(s=>s.count));

  const STATUS_COLORS = { pending:'#c3d0f0', in_progress:'#f5c842', completed:'#2ecf7a' };
  const PRI_COLORS = { high:'#ff5c5c', medium:'#f5c842', low:'#3b9eff' };

  function donutSvg(segments, size=150) {
    const total = segments.reduce((a,s)=>a+s.value,0) || 1;
    let angle = -90;
    const r = size/2 - 12, cx = size/2, cy = size/2;
    const paths = segments.map(seg => {
      const frac = seg.value/total;
      const start = angle;
      const end = angle + frac*360;
      angle = end;
      const large = (end-start) > 180 ? 1 : 0;
      const toXY = a => [cx + r*Math.cos(a*Math.PI/180), cy + r*Math.sin(a*Math.PI/180)];
      const [x1,y1] = toXY(start), [x2,y2] = toXY(end);
      if (frac >= 0.9999) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="20"/>`;
      return `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${seg.color}" stroke-width="20" stroke-linecap="round"/>`;
    }).join('');
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}
      <text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700" font-family="Sora,sans-serif">${total}</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="rgba(180,210,255,.55)" font-size="10" font-family="Sora,sans-serif">tasks</text>
      </svg>`;
  }

  root.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card" style="--c:var(--glow2)"><div class="stat-val">${total}</div><div class="stat-label">Total Tasks</div></div>
      <div class="stat-card" style="--c:var(--green)"><div class="stat-val">${completionRate}%</div><div class="stat-label">Completion Rate</div></div>
      <div class="stat-card" style="--c:var(--red)"><div class="stat-val">${overdue}</div><div class="stat-label">Overdue</div></div>
      <div class="stat-card" style="--c:var(--gold)"><div class="stat-val">${db.subjects.length}</div><div class="stat-label">Subjects</div></div>
    </div>

    <div class="grid-2" style="margin-bottom:22px">
      <div class="card card-pad">
        <div class="section-eyebrow">Breakdown</div>
        <div class="section-title" style="margin-bottom:18px">Tasks by Status</div>
        <div class="donut-wrap">
          ${donutSvg([
            {value:byStatus.pending, color:STATUS_COLORS.pending},
            {value:byStatus.in_progress, color:STATUS_COLORS.in_progress},
            {value:byStatus.completed, color:STATUS_COLORS.completed}
          ])}
          <div>
            ${Object.entries(byStatus).map(([k,v]) => `
              <div class="flex items-center gap-8" style="margin-bottom:8px">
                <span class="chip" style="background:${STATUS_COLORS[k]}"></span>
                <span style="font-size:12.5px;color:var(--muted);flex:1">${k.replace('_',' ')}</span>
                <span style="font-size:12.5px;font-weight:700">${v}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card card-pad">
        <div class="section-eyebrow">Breakdown</div>
        <div class="section-title" style="margin-bottom:18px">Tasks by Priority</div>
        ${Object.entries(byPriority).map(([k,v]) => `
          <div class="bar-row">
            <div class="bar-label">${k}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${total?Math.round(v/total*100):0}%;background:${PRI_COLORS[k]}"></div></div>
            <div class="bar-val">${v}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card card-pad">
      <div class="section-eyebrow">Per Subject</div>
      <div class="section-title" style="margin-bottom:18px">Task Load by Subject</div>
      ${bySubject.length===0 ? `<div class="empty-state"><div class="empty-title">No subjects yet</div></div>` :
        bySubject.map(s => `
        <div class="bar-row">
          <div class="bar-label">${SP.h(s.name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(s.count/maxSubjectCount*100)}%;background:${s.color}"></div></div>
          <div class="bar-val">${s.count}</div>
        </div>`).join('')}
    </div>`;
});
</script>
</body>
</html>
